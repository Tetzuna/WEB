<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koleksi Pria - Zalora Clone</title>
    <!-- Menghubungkan ke file CSS utama -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- NAVBAR -->
    <header class="main-header">
        <nav class="navbar">
            <div class="logo">ZALORA-CLONE</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="wanita.html">Wanita</a></li>
                <li><a href="pria.html" style="color: #e60000; font-weight: bold;">Pria</a></li>
                <li><a href="cart.html">Keranjang (<span id="cartCount">0</span>)</a></li>
            </ul>
        </nav>
    </header>

    <!-- KONTEN PRODUK PRIA -->
    <main class="products-container" style="margin-top: 50px;">
        <h2 class="section-title">Koleksi Fashion Pria</h2>
        
        <div class="product-grid">
            <!-- Produk Pria 1 -->
            <div class="product-card">
                <img src="download.jpg" alt="Classic Oxford Shirt" class="product-image">
                <div class="product-content">
                    <h3>Classic Oxford Shirt</h3>
                    <p class="product-price">Rp299K</p>
                    <button class="add-to-cart-btn" onclick="pilihProduk('Classic Oxford Shirt (Pria)', 'Rp299K')">
                        Tambah ke Keranjang
                    </button>
                </div>
            </div>

            <!-- Produk Pria 2 -->
            <div class="product-card">
                <img src="download.jpg" alt="Casual Slim Fit Chinos" class="product-image">
                <div class="product-content">
                    <h3>Slim Fit Chinos</h3>
                    <p class="product-price">Rp379K</p>
                    <button class="add-to-cart-btn" onclick="pilihProduk('Slim Fit Chinos', 'Rp379K')">
                        Tambah ke Keranjang
                    </button>
                </div>
            </div>

            <!-- Produk Pria 3 -->
            <div class="product-card">
                <img src="download.jpg" alt="Denim Jacket" class="product-image">
                <div class="product-content">
                    <h3>Vintage Denim Jacket</h3>
                    <p class="product-price">Rp499K</p>
                    <button class="add-to-cart-btn" onclick="pilihProduk('Vintage Denim Jacket', 'Rp499K')">
                        Tambah ke Keranjang
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer>
        <div class="footer-content">
            <p>&copy; 2026 Zalora Clone. Hak Cipta Dilindungi.</p>
        </div>
    </footer>

    <script src="script.js"></script>

</body>
</html>
