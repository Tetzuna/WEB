<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keranjang Belanja - Jason</title>
    <!-- Menghubungkan ke file CSS utama -->
    <link rel="stylesheet" href="style.css">
    <style>
        .cart-container {
            max-width: 900px;
            width: 100%;
            margin: 40px auto;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            flex: 1;
        }

        .cart-title {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .cart-box {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .cart-item h4 {
            font-size: 16px;
            margin-bottom: 5px;
        }

        .cart-item p {
            color: #e60000;
            font-weight: bold;
        }

        .cart-summary {
            background: #fff;
            padding: 25px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .cart-summary h3 {
            font-size: 18px;
            margin-bottom: 15px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 14px;
            color: #555;
        }

        .summary-row.total {
            font-weight: bold;
            font-size: 16px;
            color: #000;
            border-top: 1px solid #eee;
            padding-top: 12px;
            margin-top: 15px;
        }

        .checkout-submit-btn {
            width: 100%;
            background-color: #000;
            color: #fff;
            border: none;
            padding: 14px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            margin-top: 20px;
            transition: background-color 0.2s;
        }

        .checkout-submit-btn:hover {
            background-color: #e60000;
        }

        .reset-cart-btn {
            width: 100%;
            background-color: #ff4d4d;
            color: #fff;
            border: none;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        .reset-cart-btn:hover {
            background-color: #cc0000;
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <header class="main-header">
        <nav class="navbar">
            <div class="logo">JASON</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
            </ul>
        </nav>
    </header>

    <!-- KONTEN UTAMA KERANJANG -->
    <main class="cart-container">
        <h2 class="cart-title">Keranjang Belanja Anda</h2>

        <!-- Daftar Barang di Keranjang -->
        <div class="cart-box">
            <div id="tampilItemKeranjang">
                <p style="color: #777; text-align: center; padding: 10px;">Keranjang belanja Anda masih kosong.</p>
            </div>
        </div>

        <!-- Ringkasan Belanja -->
        <div class="cart-summary">
            <h3>Ringkasan Belanja</h3>
            <div class="summary-row">
                <span>Total Item</span>
                <span id="labelTotalItem">0 Produk</span>
            </div>
            <div class="summary-row total">
                <span>Total Pembayaran</span>
                <span id="tampilTotal">Rp0</span>
            </div>

            <button class="checkout-submit-btn" onclick="prosesCheckout()">Lanjutkan ke Pembayaran</button>
            <button class="reset-cart-btn" onclick="resetKeranjang()">Kosongkan Keranjang</button>
        </div>
    </main>

    <!-- FOOTER -->
    <footer>
        <div class="footer-content" style="max-width: 1200px; margin: 0 auto; padding: 0 20px;">
            <p>&copy; 2026 Jason. Hak Cipta Dilindungi.</p>
        </div>
    </footer>

    <!-- SKRIP JAVASCRIPT -->
    <script>
        // Fungsi bantu mengubah harga string (misal: "Rp349K") jadi angka
        const parseHarga = (strHarga) => {
            let angkaStr = strHarga.replace('Rp', '').replace('K', '000').trim();
            return parseInt(angkaStr) || 0;
        };

        const muatKeranjang = () => {
            const cart = JSON.parse(sessionStorage.getItem('zaloraCartList')) || [];
            
            const containerItem = document.getElementById('tampilItemKeranjang');
            const labelTotalItem = document.getElementById('labelTotalItem');
            const tampilTotal = document.getElementById('tampilTotal');
            const cartCountBadge = document.getElementById('cartCount');

            // Hitung total item untuk badge navbar
            const totalItemBadge = cart.reduce((sum, item) => sum + item.qty, 0);
            if (cartCountBadge) cartCountBadge.innerText = totalItemBadge;

            if (cart.length === 0) {
                containerItem.innerHTML = '<p style="color: #777; text-align: center; padding: 10px;">Keranjang belanja Anda masih kosong.</p>';
                labelTotalItem.innerText = '0 Produk';
                tampilSubtotal.innerText = 'Rp0';
                labelOngkir.innerText = 'Rp0';
                tampilTotal.innerText = 'Rp0';
                return;
            }

            let htmlContent = '';
            let totalHargaAngka = 0;
            let totalJumlahItem = 0;

            cart.forEach(item => {
                const hargaAngka = parseHarga(item.harga);
                const subtotalItem = hargaAngka * item.qty;
                
                totalHargaAngka += subtotalItem;
                totalJumlahItem += item.qty;

                htmlContent += `
                    <div class="cart-item">
                        <div>
                            <h4>${item.nama}</h4>
                            <p>${item.harga}</p>
                        </div>
                        <div>
                            <span>Qty: ${item.qty}</span>
                        </div>
                    </div>
                `;
            });

            containerItem.innerHTML = htmlContent;
            
            const totalPembayaran = totalHargaAngka;
            const formatRupiah = (angka) => 'Rp' + (angka / 1000) + 'K';

            labelTotalItem.innerText = `${totalJumlahItem} Produk`;
            tampilTotal.innerText = formatRupiah(totalPembayaran);
        };

        // Fungsi Kosongkan Keranjang
        const resetKeranjang = () => {
            if (confirm("Apakah Anda yakin ingin mengosongkan keranjang belanja?")) {
                sessionStorage.removeItem('zaloraCartList');
                muatKeranjang(); // Muat ulang tampilan tanpa perlu reload halaman
            }
        };

        // Fungsi Checkout
        const prosesCheckout = () => {
            const cart = JSON.parse(sessionStorage.getItem('zaloraCartList')) || [];
            if (cart.length === 0) {
                alert('Keranjang Anda masih kosong!');
                return;
            }
            alert('Pesanan Anda berhasil diproses! Terima kasih telah berbelanja.');
            sessionStorage.removeItem('zaloraCartList');
            window.location.href = 'index.html';
        };

        // Jalankan saat halaman selesai dimuat
        document.addEventListener("DOMContentLoaded", muatKeranjang);
    </script>

</body>
</html>
