<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jason - Home</title>
    <!-- Menghubungkan ke file CSS eksternal -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- NAVBAR -->
    <header class="main-header">
        <nav class="navbar">
            <div class="logo">JASON</div>
            <ul class="nav-links">
                <li><a href="cart.html">Keranjang (<span id="cartCount">0</span>)</a></li>
            </ul>
        </nav>
    </header>

    <!-- HERO BANNER DENGAN TOMBOL BELANJA SEKARANG -->
    <section class="hero-section">
        <h1>Koleksi Fashion Terbaru</h1>
        <p>Temukan gaya terbaikmu setiap hari bersama Jason.</p>
        <!-- Tombol untuk melompat mulus ke bagian produk di bawah -->
        <button class="btn-hero" onclick="turunKeBawah()">Belanja Sekarang</button>
    </section>

    <!-- KONTEN PRODUK DI BAWAH -->
    <main class="products-container" id="koleksi-produk">
        <h2 class="section-title">Pilihan Produk</h2>
        
        <div class="product-grid">
            <!-- Produk 1 -->
            <div class="product-card">
                <img src="download.jpg" alt="Golden Essence" class="product-image">
                <div class="product-content">
                    <h3>Golden Essence</h3>
                    <p class="product-price">Rp349K</p>
                    <button class="add-to-cart-btn" onclick="pilihProduk('Golden Essence', 'Rp349K')">
                        Tambah ke Keranjang
                    </button>
                </div>
            </div>

            <!-- Produk 2 -->
            <div class="product-card">
                <img src="download.jpg" alt="Classic Oxford Shirt" class="product-image">
                <div class="product-content">
                    <h3>Classic Oxford Shirt</h3>
                    <p class="product-price">Rp299K</p>
                    <button class="add-to-cart-btn" onclick="pilihProduk('Classic Oxford Shirt', 'Rp299K')">
                        Tambah ke Keranjang
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer>
        <div class="footer-content">
            <p>&copy; 2026 Jason. Hak Cipta Dilindungi.</p>
        </div>
    </footer>

    <!-- Menghubungkan ke file JavaScript eksternal -->
    <script src="scripts.js"></script>

</body>
</html>
